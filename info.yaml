project:
  title: "8-bit LFSR Random Generator"
  author: "Raksha"
  discord: "your_discord_username"
  description: "An 8-bit pseudo-random number generator using Linear Feedback Shift Register architecture."
  language: "Verilog"
  clock_hz: 1000000

  tiles: "1x1"

  top_module: "tt_um_raksha_lfsr"

  source_files:
    - "tt_um_raksha_lfsr.v"

pinout:
  ui[0]: "Enable"
  ui[1]: "Load Seed"
  ui[2]: "Seed Bit 0"
  ui[3]: "Seed Bit 1"
  ui[4]: "Seed Bit 2"
  ui[5]: "Seed Bit 3"
  ui[6]: "Seed Bit 4"
  ui[7]: "Seed Bit 5"

  uo[0]: "LFSR Bit 0"
  uo[1]: "LFSR Bit 1"
  uo[2]: "LFSR Bit 2"
  uo[3]: "LFSR Bit 3"
  uo[4]: "LFSR Bit 4"
  uo[5]: "LFSR Bit 5"
  uo[6]: "LFSR Bit 6"
  uo[7]: "LFSR Bit 7"

  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"
